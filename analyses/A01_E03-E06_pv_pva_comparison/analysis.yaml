  allow_dirty_git: true

sources:
  - source_id: e03_pva_truth
    experiment_id: E03
    source_directory: experiments/E03_pva_truth_trajectories/results/20260728T094251.738911Z__c736ade95ca0
    factors:
      target_components: PVA
      method_matrix: truth
  - source_id: e04_pva_finite_difference
    experiment_id: E04
    source_directory: experiments/E04_pva_finite_difference_trajectories/results/20260728T105110.685320Z__6fbb9164fb94
    factors:
      target_components: PVA
      method_matrix: finite_difference
  - source_id: e05_pv_truth
    experiment_id: E05
    source_directory: experiments/E05_pv_truth_trajectories/results/20260728T094251.738900Z__7e74aae4f09e
    factors:
      target_components: PV
      method_matrix: truth
  - source_id: e06_pv_finite_difference
    experiment_id: E06
    source_directory: experiments/E06_pv_finite_difference_trajectories/results/20260728T105110.685320Z__7aba729401c1
    factors:
      target_components: PV
      method_matrix: finite_difference

artifacts:
  trajectory_metrics: analysis/trajectory_metrics.csv
  comparisons: analysis/comparisons.csv

