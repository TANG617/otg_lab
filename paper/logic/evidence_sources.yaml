    allowed_scientific_use:
      - Controlled Phase A comparison of P, analytic-truth PV, and analytic-truth PVA.
      - Report position RMSE, maximum error, and grid-searched lag under the fixed protocol.
      - State that reliable analytic target velocity reduced error and lag on all three tested smooth references.
      - State that PVA truth did not improve position metrics over PV truth within numerical precision in these tested conditions.
