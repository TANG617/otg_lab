    evidence_class: confirmed_current
    dataset:
      - quadratic_with_extremum
      - cubic
      - sine
    information_condition: >
      Single-joint ordinary Ruckig Community 0.17.3, DT=10 ms,
      target[k] -> output[k+1], previous native output as the next current state,
      vmax=4.1 rad/s, amax=8.2 rad/s^2, jmax=4000 rad/s^3,
      minimum_duration=10 ms, no lookahead.
    causal_noncausal: >
      P is causal; analytic-truth PV/PVA are oracle information conditions.
      Individual finite-difference rows retain their own causal/future-sample flags.
    evidence_epoch: current
    lifecycle: current_checked_in_phase_a_result
    allowed_scientific_use:
      - Controlled Phase A comparison of P, analytic-truth PV, and analytic-truth PVA.
      - Report position RMSE, maximum error, and grid-searched lag under the fixed protocol.
      - State that reliable analytic target velocity reduced error and lag on all three tested smooth references.
      - State that PVA truth did not improve position metrics over PV truth within numerical precision in these tested conditions.
    forbidden_interpretation:
      - Do not claim that position-only data can provide analytic velocity or acceleration online.
      - Do not generalize from three smooth single-joint references to arbitrary streams, robots, or plants.
      - Do not claim statistical significance; this table contains three deterministic reference cases.
      - Do not claim PVA superiority over P or PV.
      - Do not treat OutputParameter.new_jerk as a complete internal Ruckig-profile jerk audit.
    quantitative_fields_available:
      - rmse
      - mae
      - max_error
      - best_lag_ms
      - lag_aligned_rmse
      - raw_target_feasible_rate
      - target_projection_rate
      - reachable_within_10ms_rate
      - output_max_velocity
      - output_max_acceleration
      - output_max_new_jerk
      - output_max_sampled_jerk
      - ruckig_compute_p99_us
    notes:
      - >
        The manifest records git_worktree_dirty=true. It records exact generator/input
        byte hashes, but all recorded generator hashes except plot_data.csv differ from
        current HEAD. The aggregate evidence is therefore immutable checked-in Phase A
        output, not a result freshly regenerated from current source.
      - >
        Per-cycle Phase A command output is not preserved, so non-P aggregate RMSE values
        can be checked against the CSV/README and code definitions but cannot be
        independently recomputed from raw samples in this repository.

