external_blockers:
  - blocker_id: B_INDEPENDENT_REAL_LOCKED_TEST
    evidence_class: external_blocker
    missing_source: Multiple independent, held-out real position-only traces with preserved source and arrival timestamps.
    consequence: Real-stream generalization is not evaluable.
  - blocker_id: B_HARDWARE_OR_HIL
    evidence_class: external_blocker
    missing_source: Hardware or HIL command/measurement logs with plant, torque, collision, and timing evidence.
    consequence: Real-robot and production-safety claims are not evaluable.
  - blocker_id: B_FUTURE_V5_CONFIRMATION
    evidence_class: not_evaluated
    missing_source: >
      Fresh V5 locked test with new identities/seeds and a preregistered audit
      that separates exogenous-information validity, estimator/predictor state,
      execution, runtime, and plant outcomes.
    consequence: >
      V4 remains non-confirmatory and permanently frozen; a future
      confirmatory PVA performance claim requires V5.
  - blocker_id: B_TRACKIG_MEASUREMENT
    evidence_class: external_blocker
    missing_source: Measured Ruckig Pro Trackig results under the paper protocol.
    consequence: No empirical claim about Trackig performance or necessity is permitted.
