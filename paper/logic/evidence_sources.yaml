      - output_max_new_jerk
      - output_max_sampled_jerk
      - ruckig_compute_p99_us
    notes:
      - >
        The manifest records git_worktree_dirty=true. It records exact generator/input
        byte hashes, but all recorded generator hashes except plot_data.csv differ from
        current HEAD. The aggregate evidence is therefore immutable checked-in Phase A
        output, not a result freshly regenerated from current source.
      - >
        Per-cycle Phase A command output is not preserved, so non-P aggregate RMSE values
