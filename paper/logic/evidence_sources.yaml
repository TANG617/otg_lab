    information_condition: >
      Single-joint ordinary Ruckig Community 0.17.3, DT=10 ms,
      target[k] -> output[k+1], previous native output as the next current state,
      vmax=4.1 rad/s, amax=8.2 rad/s^2, jmax=4000 rad/s^3,
