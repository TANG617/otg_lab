      - Do not claim that position-only data can provide analytic velocity or acceleration online.
      - Do not generalize from three smooth single-joint references to arbitrary streams, robots, or plants.
      - Do not claim statistical significance; this table contains three deterministic reference cases.
      - Do not claim PVA superiority over P or PV.
      - Do not treat OutputParameter.new_jerk as a complete internal Ruckig-profile jerk audit.
    quantitative_fields_available:
