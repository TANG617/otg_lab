[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "otg-lab"
version = "0.1.0"
description = "Causal position-only online trajectory generation experiment platform"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
  "matplotlib==3.9.4",
  "numpy==2.0.2",
  "osqp==1.1.3",
  "pandas==2.3.3",
  "pyarrow==21.0.0",
  "PyYAML==6.0.2",
  "ruckig==0.17.3",
  "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[tool.setuptools]
packages = ["otg_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

